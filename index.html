<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شمعة</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#12100f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="شمعة">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<style>
  :root{
    --bg:#12100f; --panel:#1b1816; --line:#2b2724;
    --cream:#f2e8d5; --ember:#f0a03a; --dim:#8a8078;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--cream);
    font-family:"Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:40px; padding:32px 20px calc(40px + env(safe-area-inset-bottom));
    overflow:hidden; -webkit-tap-highlight-color:transparent;
  }

  .stage{position:relative; display:flex; align-items:center; justify-content:center}
  .halo{
    position:absolute; width:300px; height:300px; border-radius:50%;
    background:radial-gradient(circle,rgba(240,160,58,.30),rgba(240,160,58,0) 65%);
    opacity:0; transition:opacity .5s ease;
  }
  body.lit .halo{opacity:1; animation:breathe 3.6s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.08)}}

  svg{position:relative; width:170px; height:auto}
  #flame{opacity:0; transform-origin:50% 100%; transition:opacity .28s ease}
  body.lit #flame{opacity:1; animation:flicker 1.5s ease-in-out infinite}
  @keyframes flicker{
    0%,100%{transform:scale(1,1) translateX(0)}
    30%{transform:scale(.94,1.06) translateX(-1px)}
    60%{transform:scale(1.05,.96) translateX(1.5px)}
  }
  #smoke{opacity:0}
  body.smoking #smoke{animation:smoke 1.6s ease-out 1}
  @keyframes smoke{
    0%{opacity:.55; transform:translateY(0) scaleX(1)}
    100%{opacity:0; transform:translateY(-38px) scaleX(1.6)}
  }

  #toggle{
    width:100%; max-width:280px; padding:20px 0;
    font-size:22px; font-weight:700; letter-spacing:2px; font-family:inherit;
    border-radius:18px; border:1px solid var(--line); background:var(--panel);
    color:var(--cream); cursor:pointer; transition:transform .12s, background .2s, border-color .2s, color .2s;
  }
  #toggle:active{transform:scale(.97)}
  #toggle:focus-visible{outline:2px solid var(--ember); outline-offset:3px}
  #toggle[aria-checked="false"]{background:var(--ember); border-color:var(--ember); color:#1a1105}
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>
</head>
<body class="lit">

<div class="stage">
  <div class="halo"></div>
  <svg viewBox="0 0 100 150" aria-hidden="true">
    <g id="smoke">
      <path d="M50 58 q-4 -8 0 -14 q4 -6 0 -12" stroke="#8a8078" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    <g id="flame">
      <path d="M50 30 q9 12 9 22 q0 12 -9 16 q-9 -4 -9 -16 q0 -10 9 -22z" fill="#f0a03a"/>
      <path d="M50 44 q5 7 5 13 q0 7 -5 9 q-5 -2 -5 -9 q0 -6 5 -13z" fill="#ffd98a"/>
    </g>
    <line x1="50" y1="62" x2="50" y2="70" stroke="#3a322c" stroke-width="3" stroke-linecap="round"/>
    <rect x="34" y="70" width="32" height="58" rx="6" fill="#f2e8d5"/>
    <rect x="56" y="70" width="10" height="58" rx="5" fill="#d6c8b0"/>
    <ellipse cx="50" cy="70" rx="16" ry="5" fill="#faf3e6"/>
  </svg>
</div>

<button id="toggle" role="switch" aria-checked="true" aria-label="الشمعة">OFF</button>

<script>
  const body = document.body;
  const btn = document.getElementById('toggle');

  function setState(lit){
    if(!lit && body.classList.contains('lit')){
      body.classList.add('smoking');
      setTimeout(()=>body.classList.remove('smoking'), 1600);
    }
    body.classList.toggle('lit', lit);
    btn.setAttribute('aria-checked', lit);
    btn.textContent = lit ? 'OFF' : 'ON';
    try{ localStorage.setItem('shamaa', lit ? '1' : '0'); }catch(e){}
  }

  btn.addEventListener('click', ()=>setState(!body.classList.contains('lit')));
  try{ if(localStorage.getItem('shamaa') === '0') setState(false); }catch(e){}

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
</script>
</body>
</html>
